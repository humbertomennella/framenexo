name: Aviso de falha
on:
  workflow_run:
    workflows: ['Coleta e edição', 'Publicação manual', 'Publicar site']
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - run: python3 scripts/notify_failure.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
