name: Escuta editorial
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scout.yml'
      - 'scripts/run_scout.py'
      - 'scripts/scout_snapshot.py'
      - 'scripts/pipeline.py'
      - 'data/sources.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apurante-scout-snapshot
  cancel-in-progress: false
jobs:
  scout:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Testar núcleo editorial
        run: python3 -m unittest discover -s tests -v
      - name: Recuperar último snapshot concluído
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/scout_snapshot.py
      - name: Observar fontes sem publicar
        run: python3 scripts/run_scout.py
      - name: Confirmar ausência de alterações no repositório
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Persistir snapshot imutável
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apurante-scout-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/scout/snapshot.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Registrar resultado da escuta
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name in ('restore', 'scout-state'):
                  path = Path('.cache/scout') / (name + '.json')
                  if path.exists():
                      summary.write('\n```json\n' + json.dumps(json.loads(path.read_text()), ensure_ascii=False, indent=2) + '\n```\n')
          PYREPORT
