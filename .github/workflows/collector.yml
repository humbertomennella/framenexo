name: Coleta e edição
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collector.yml'
      - 'scripts/run_editorial.py'
      - 'scripts/publish_edition.py'
      - 'scripts/editorial_selection.py'
      - 'scripts/commit_changes.py'
      - 'data/edition-schedule.json'
      - 'tests/test_editions.py'
  schedule:
    - cron: '0 1,11,16,21 * * *'
    - cron: '27 1,11,16,21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publicar uma edição extraordinária fora do cronograma
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: framenexo-editorial
  cancel-in-progress: false
jobs:
  editorial:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
      issues: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Restaurar modelo local em cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/model
          key: apurante-local-model-${{ runner.os }}-${{ hashFiles('data/model-lock.json') }}
      - run: npm ci
      - run: npm test
      - name: Recuperar último snapshot concluído
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/scout_snapshot.py
      - name: Verificar snapshot e redigir a edição
        id: pipeline
        continue-on-error: true
        env:
          FORCE_EDITION: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.force }}
        run: |
          if [ "$FORCE_EDITION" = "true" ]; then
            python3 scripts/run_editorial.py --force
          else
            python3 scripts/run_editorial.py
          fi
      - name: Validar antes de salvar conteúdo
        if: steps.pipeline.outcome == 'success'
        run: |
          npm run build
          npm run check:site
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Salvar edição aprovada
        if: steps.pipeline.outcome == 'success'
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/commit_changes.py
      - name: Alertar falhas parciais de coleta
        if: always() && steps.pipeline.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/notify_collection.py
      - name: Registrar resultado independente da publicação
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: python3 scripts/editorial_report.py
      - name: Preservar relatório do fechamento
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apurante-editorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/editorial-report.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Registrar falha da execução
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
  deploy:
    needs: editorial
    if: ${{ always() && needs.editorial.outputs.changed == 'true' && needs.editorial.outputs.sha != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.editorial.outputs.sha }}
